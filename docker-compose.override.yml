services:
  server:
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: npm run dev

  frontend:
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

  admin:
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 4000

volumes:
  server_node_modules:
  frontend_node_modules:
  admin_node_modules:
  frontend_next:
  admin_next:
