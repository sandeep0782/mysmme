services:
  frontend:
    build:
      context: ./frontend
      args:
     	NEXT_PUBLIC_API_URL: https://api.mysmme.com
     	NEXT_PUBLIC_SITE_URL: https://mysmme.com
    container_name: mysmme-frontend
    ports:
      - "3000:3000"
    depends_on:
      - server

  admin:
    build:
      context: ./admin
    container_name: mysmme-admin
    ports:
      - "4000:4000"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: mysmme-server
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
